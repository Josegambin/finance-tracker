spring:
  application:
    name: finance-tracker-api

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/finance_tracker}
    username: ${DB_USERNAME:finance_user}
    password: ${DB_PASSWORD:finance_password}

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

  flyway:
    enabled: false
    locations: classpath:db/migration
    baseline-on-migrate: true

logging:
  level:
    root: INFO
    finance_tracker_api: DEBUG
    org.springframework.security: WARN
    org.hibernate.SQL: WARN

server:
  port: ${SERVER_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when-authorized

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    enabled: true

security:
  jwt:
    secret: ${JWT_SECRET:finance-tracker-local-development-secret-2026}
    expiration: ${JWT_EXPIRATION:3600000}
    refresh-expiration: ${JWT_REFRESH_EXPIRATION:604800000}

rate-limiting:
  enabled: true
  auth-endpoint:
    capacity: 5
    refill-tokens: 5
    refill-duration: 60

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost,http://localhost:80,http://127.0.0.1,http://localhost:5173,http://localhost:8080}

